name: tiktok_seller
description: Offline-first sales recap foundation for TikTok Seller.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # SQLite API on Android, backed by the platform SQLite implementation.
  sqflite: ^2.4.0
  # Supplies the SQLite FFI database factory required for Windows desktop.
  sqflite_common_ffi: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
